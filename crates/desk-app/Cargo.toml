[package]
name = "desk-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "flashdesk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = "3"
bincode = "1"
base64 = "0.22"
bytemuck = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
openh264 = { version = "0.8", default-features = false, features = ["source"] }
# Raw option constants for dynamic bitrate (ENCODER_OPTION_BITRATE) without re-initialising (= no IDR).
openh264-sys2 = { version = "0.8", default-features = false }
png = "0.18"
protocol = { path = "../protocol" }
qrcode = { version = "0.14", default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.58", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
