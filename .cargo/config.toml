[build]
target-dir = "D:\\Rust\\target-flashdesk"

[env]
CXXSTDLIB = ""

[target.x86_64-pc-windows-gnu]
linker = "D:\\Rust\\mingw64\\bin\\x86_64-w64-mingw32-g++.exe"
ar = "D:\\Rust\\mingw64\\bin\\x86_64-w64-mingw32-ar.exe"
rustflags = [
    "-C", "link-arg=-static-libgcc",
    "-C", "link-arg=-static-libstdc++",
]

[target.x86_64-unknown-linux-musl]
linker = "D:\\Rust\\rustup\\toolchains\\stable-x86_64-pc-windows-gnu\\lib\\rustlib\\x86_64-pc-windows-gnu\\bin\\rust-lld.exe"
rustflags = [
    "-C", "linker-flavor=ld.lld",
    "-C", "link-self-contained=yes",
    "-C", "target-feature=+crt-static",
]
